<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Themes — Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="solo"><h1>🎨 Themes & Fonts</h1><p>Choose default theme and font. Production version will save these settings to the database.</p><div class="swatches"><button onclick="setTheme('#ff980d')">Orange</button><button onclick="setTheme('#ffd21f')">Yellow</button><button onclick="setTheme('#ff4d5a')">Red</button><button onclick="setTheme('#4da3ff')">Blue</button><button onclick="setTheme('#a970ff')">Purple</button><button onclick="setTheme('#48d597')">Green</button></div><a href="index.html">← Admin Dashboard</a><script>function setTheme(c){localStorage.setItem('devos-admin-accent',c);document.documentElement.style.setProperty('--accent',c)}</script></main></body></html>
